<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giàcasa · mappa Milano e dintorni</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
--ink:#0a1826;--ink-2:#12293d;--blue-700:#1b3c56;--blue-200:#d6e5ee;--blue-100:#eef4f8;
--paper:#f5f1e9;--surface:#fffdf9;--text:#15120e;--accent:#c2461d;--brass:#d3a534;
--n-600:#6f5f4c;--n-700:#52463a;
--sans:"Plus Jakarta Sans",system-ui,sans-serif;--serif:"Newsreader",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);font-family:var(--sans);color:var(--text)}
#map{position:absolute;inset:0}
.leaflet-container{background:var(--blue-100);font-family:var(--sans)}
.bar{position:absolute;z-index:500;left:0;right:0;top:0;padding:10px 10px 14px;
  background:linear-gradient(to bottom,rgba(10,24,38,.92),rgba(10,24,38,.72) 62%,transparent);
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(255,255,255,.34);color:#fff;background:transparent;
  padding:7px 11px;border-radius:999px;font:600 11px/1 var(--sans);letter-spacing:.02em;cursor:pointer;
  transition:background .18s ease,color .18s ease,border-color .18s ease;white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.14)}
.chip.on{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.tools{position:absolute;z-index:500;right:10px;bottom:118px;display:flex;flex-direction:column;gap:7px}
.tool{width:38px;height:38px;border-radius:12px;border:1px solid rgba(21,18,14,.14);background:var(--surface);
  color:var(--ink);font:600 17px/1 var(--sans);display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 8px 20px -14px rgba(10,24,38,.5);transition:background .18s ease}
.tool:hover{background:var(--blue-100)}
.tool.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tool span{font:600 9px/1.15 var(--sans);letter-spacing:.06em;text-align:center}
.pinwrap{transform:translate(-50%,-115%)}
.pin{display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;background:var(--surface);
  border:1px solid rgba(10,24,38,.18);box-shadow:0 8px 18px -12px rgba(10,24,38,.55);
  font:700 11.5px/1 var(--sans);color:var(--ink);white-space:nowrap;cursor:pointer;transition:transform .16s ease}
.pin:hover{transform:translateY(-2px)}
.pin i{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.pin.on{background:var(--accent);border-color:var(--accent);color:#fff;z-index:600}
.pin.on i{background:#fff}
.zone{transform:translate(-50%,-50%);font:700 10px/1 var(--sans);letter-spacing:.04em;color:var(--blue-700);text-shadow:0 1px 0 rgba(255,255,255,.85);white-space:nowrap}
.card{position:absolute;z-index:500;left:10px;right:10px;bottom:10px;background:var(--surface);
  border:1px solid rgba(21,18,14,.12);border-radius:16px;padding:13px 14px;
  box-shadow:0 1px 1px rgba(16,25,35,.04),0 22px 40px -26px rgba(16,25,35,.5)}
.card .kicker{font:600 9px/1 var(--sans);letter-spacing:.16em;color:var(--n-600);margin-bottom:6px}
.card h2{margin:0;font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.1;letter-spacing:-.015em}
.card .meta{font-size:11.5px;color:var(--n-700);margin-top:3px}
.row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:11px}
.price{font-family:var(--serif);font-size:24px;line-height:1}
.fee{font:600 10px/1 var(--sans);letter-spacing:.1em;background:#f4e4bd;color:#7a5410;padding:6px 8px;border-radius:999px}
.cta{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);
  color:#fff;border-radius:12px;padding:12px;font:700 12px/1 var(--sans);letter-spacing:.09em;
  text-transform:uppercase;cursor:pointer;transition:background .18s ease}
.cta:hover{background:#993317}
.hint{position:absolute;z-index:400;left:12px;bottom:118px;max-width:190px;font:600 9.5px/1.45 var(--sans);
  letter-spacing:.04em;color:var(--blue-700);background:rgba(255,253,249,.88);border-radius:10px;padding:7px 9px}
.leaflet-control-attribution{font-family:var(--sans);font-size:9px}
</style>
</head>
<body>
<div id="map"></div>
<div class="bar" id="bar"></div>
<div class="tools">
  <div class="tool" id="zoomin" title="Ingrandisci">+</div>
  <div class="tool" id="zoomout" title="Riduci">−</div>
  <div class="tool" id="prezzi" title="Prezzi al m²"><span>€/M²</span></div>
</div>
<div class="hint" id="hint">TOCCA UN PREZZO PER VEDERE LA CASA · TRASCINA PER MUOVERTI</div>
<div class="card" id="card" hidden></div>

<script>
const EUR = n => n.toLocaleString('it-IT') + ' €';
const feeFor = p => p <= 100000 ? 1990 : p <= 200000 ? 2990 : p <= 350000 ? 3990 : p <= 500000 ? 5990 : p <= 750000 ? 7990 : 9990;
const agencyFor = p => Math.round(p * 0.03 * 1.22 / 10) * 10;

const CASE = [
  { id: 1, zona: 'MILANO · ISOLA', title: 'Via Borsieri 24', price: 189000, mq: 72, locali: 3, lat: 45.4873, lng: 9.1905 },
  { id: 2, zona: 'SESTO S. GIOVANNI · MARELLI', title: 'Via Marelli 60', price: 132000, mq: 70, locali: 3, lat: 45.5359, lng: 9.2360 },
  { id: 3, zona: 'MILANO · NOLO', title: 'Via Padova 88', price: 158000, mq: 68, locali: 3, lat: 45.4972, lng: 9.2273 },
  { id: 4, zona: 'MILANO · NAVIGLI', title: 'Via Vigevano 12', price: 410000, mq: 105, locali: 4, lat: 45.4524, lng: 9.1682 },
  { id: 5, zona: 'SEGRATE · MILANO DUE', title: 'Residenza Pellico 4', price: 210000, mq: 92, locali: 4, lat: 45.4976, lng: 9.2957 },
  { id: 6, zona: 'MILANO · BRERA', title: 'Via Palermo 5', price: 690000, mq: 128, locali: 4, lat: 45.4757, lng: 9.1848 },
  { id: 7, zona: 'MILANO · CITTÀ STUDI', title: 'Via Pascoli 45', price: 295000, mq: 95, locali: 4, lat: 45.4780, lng: 9.2270 },
  { id: 8, zona: 'RHO · CENTRO', title: 'Via Meda 7', price: 119000, mq: 66, locali: 3, lat: 45.5305, lng: 9.0395 },
  { id: 9, zona: 'SAN DONATO MILANESE', title: 'Via Europa 14', price: 168000, mq: 78, locali: 3, lat: 45.4172, lng: 9.2680 },
  { id: 10, zona: 'MILANO · BICOCCA', title: 'Via Chiese 20', price: 225000, mq: 85, locali: 3, lat: 45.5178, lng: 9.2130 },
  { id: 11, zona: 'ROZZANO · QUINTO', title: 'Viale Lombardia 33', price: 105000, mq: 62, locali: 2, lat: 45.3830, lng: 9.1590 },
  { id: 12, zona: 'MONZA · SAN BIAGIO', title: 'Via Bergamo 18', price: 245000, mq: 98, locali: 4, lat: 45.5845, lng: 9.2744 },
];

/* €/m² indicativi per zona, usati dal livello prezzi */
const ZONE = [
  { n: 'Centro storico', lat: 45.4655, lng: 9.1895, mq: 9600, r: 1100 },
  { n: 'Brera', lat: 45.4757, lng: 9.1848, mq: 8300, r: 700 },
  { n: 'Isola', lat: 45.4873, lng: 9.1905, mq: 6900, r: 800 },
  { n: 'Navigli', lat: 45.4524, lng: 9.1682, mq: 6600, r: 900 },
  { n: 'Città Studi', lat: 45.4780, lng: 9.2270, mq: 5100, r: 900 },
  { n: 'NoLo', lat: 45.4972, lng: 9.2273, mq: 4300, r: 900 },
  { n: 'Bicocca', lat: 45.5178, lng: 9.2130, mq: 3700, r: 900 },
  { n: 'Barona', lat: 45.4320, lng: 9.1480, mq: 3300, r: 1000 },
  { n: 'Baggio', lat: 45.4620, lng: 9.0930, mq: 3100, r: 1000 },
  { n: 'Sesto S. Giovanni', lat: 45.5359, lng: 9.2360, mq: 2600, r: 1400 },
  { n: 'Cinisello Balsamo', lat: 45.5560, lng: 9.2140, mq: 2350, r: 1300 },
  { n: 'Monza', lat: 45.5845, lng: 9.2744, mq: 3000, r: 1800 },
  { n: 'Segrate', lat: 45.4976, lng: 9.2957, mq: 2450, r: 1300 },
  { n: 'San Donato Mil.', lat: 45.4172, lng: 9.2680, mq: 2750, r: 1300 },
  { n: 'Rozzano', lat: 45.3830, lng: 9.1590, mq: 2200, r: 1300 },
  { n: 'Corsico', lat: 45.4280, lng: 9.1100, mq: 2500, r: 1100 },
  { n: 'Rho', lat: 45.5305, lng: 9.0395, mq: 2100, r: 1500 },
  { n: 'Bollate', lat: 45.5450, lng: 9.1170, mq: 2250, r: 1300 },
  { n: 'Pioltello', lat: 45.5000, lng: 9.3330, mq: 2050, r: 1200 },
  { n: 'Peschiera Borromeo', lat: 45.4300, lng: 9.3100, mq: 2400, r: 1200 },
];

const VISTE = [
  { k: 'Tutta la città', b: [[45.34, 9.00], [45.62, 9.36]] },
  { k: 'Centro', b: [[45.448, 9.162], [45.486, 9.222]] },
  { k: 'Nord', b: [[45.49, 9.13], [45.60, 9.29]] },
  { k: 'Est', b: [[45.45, 9.22], [45.53, 9.36]] },
  { k: 'Sud', b: [[45.36, 9.10], [45.45, 9.30]] },
  { k: 'Ovest', b: [[45.42, 8.99], [45.55, 9.16]] },
];

const map = L.map('map', {
  center: [45.4720, 9.1900], zoom: 11, zoomControl: false,
  maxBounds: [[45.24, 8.82], [45.74, 9.58]], maxBoundsViscosity: 0.85, minZoom: 10, maxZoom: 17,
});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 19,
}).addTo(map);

const colore = mq => mq > 7500 ? '#7a2f10' : mq > 5500 ? '#c2461d' : mq > 4000 ? '#d3a534' : mq > 3000 ? '#3f7aa3' : '#1b3c56';

const prezziLayer = L.layerGroup();
ZONE.forEach(z => {
  L.circle([z.lat, z.lng], {
    radius: z.r, color: colore(z.mq), weight: 1, fillColor: colore(z.mq), fillOpacity: 0.22,
  }).addTo(prezziLayer);
  L.marker([z.lat, z.lng], {
    interactive: false,
    icon: L.divIcon({ className: '', html: '<div class="zonewrap"><div class="zone">' + z.n + ' · ' + (z.mq / 1000).toFixed(1).replace('.', ',') + 'k €/m²</div></div>', iconSize: [0, 0] }),
  }).addTo(prezziLayer);
});

let sel = null;
const markers = {};
CASE.forEach(c => {
  const m = L.marker([c.lat, c.lng], {
    icon: L.divIcon({
      className: '', iconSize: [0, 0],
      html: '<div class="pinwrap"><div class="pin" data-id="' + c.id + '"><i></i>' + EUR(feeFor(c.price)) + '</div></div>',
    }),
    riseOnHover: true,
  }).addTo(map);
  m.on('click', () => scegli(c.id));
  markers[c.id] = m;
});

function pinEl(id) { const e = markers[id].getElement(); return e && e.querySelector('.pin'); }

function scegli(id, vola) {
  if (sel !== null && pinEl(sel)) pinEl(sel).classList.remove('on');
  sel = id;
  const c = CASE.find(x => x.id === id);
  if (pinEl(id)) pinEl(id).classList.add('on');
  if (vola !== false) map.panTo([c.lat, c.lng], { animate: true });
  const risparmio = agencyFor(c.price) - feeFor(c.price);
  document.getElementById('hint').hidden = true;
  const card = document.getElementById('card');
  card.hidden = false;
  card.innerHTML =
    '<div class="kicker">' + c.zona + '</div>' +
    '<h2>' + c.title + '</h2>' +
    '<div class="meta">' + c.locali + ' locali · ' + c.mq + ' m² · ' + Math.round(c.price / c.mq).toLocaleString('it-IT') + ' €/m²</div>' +
    '<div class="row"><div class="price">' + EUR(c.price) + '</div>' +
    '<div class="fee">TARIFFA ' + EUR(feeFor(c.price)) + ' · RISPARMI ' + EUR(risparmio) + '</div></div>' +
    '<div class="cta" id="apri">Vedi la casa e prenota la visita</div>';
  document.getElementById('apri').onclick = () => post('open', c.id);
  post('select', c.id);
}

function post(azione, id) {
  try { parent.postMessage({ giacasa: azione, id: id }, '*'); } catch (e) {}
}

const bar = document.getElementById('bar');
VISTE.forEach((v, i) => {
  const b = document.createElement('div');
  b.className = 'chip' + (i === 0 ? ' on' : '');
  b.textContent = v.k;
  b.onclick = () => {
    [...bar.children].forEach(c => c.classList.remove('on'));
    b.classList.add('on');
    map.fitBounds(v.b, { padding: [24, 24] });
  };
  bar.appendChild(b);
});

document.getElementById('zoomin').onclick = () => map.zoomIn();
document.getElementById('zoomout').onclick = () => map.zoomOut();
const tPrezzi = document.getElementById('prezzi');
tPrezzi.onclick = () => {
  const attivo = map.hasLayer(prezziLayer);
  if (attivo) { map.removeLayer(prezziLayer); tPrezzi.classList.remove('on'); }
  else { prezziLayer.addTo(map); tPrezzi.classList.add('on'); }
};

window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.giacasa === 'select-da-app' && markers[d.id]) scegli(d.id, true);
});
map.on('click', () => { /* la scheda resta: nessun vicolo cieco */ });
scegli(1, false);
</script>
</body>
</html>
